name: Deploy coleco

on:
  push:
    branches: [ main ]
    paths:
      - "apps/coleco/**"
      - ".github/workflows/deploy-coleco.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config apps/coleco/wrangler.toml

      - name: Push Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          LETTA_SUPPLEMENTAL_URL: ${{ secrets.LETTA_SUPPLEMENTAL_URL }}
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          NOTION_SUPPLEMENTAL_URL: ${{ secrets.NOTION_SUPPLEMENTAL_URL }}
          NOTION_SUPPLEMENTAL_TOKEN: ${{ secrets.NOTION_SUPPLEMENTAL_TOKEN }}
          CONSTELLATION_REGISTRY_URL: ${{ secrets.CONSTELLATION_REGISTRY_URL }}
          CONSTELLATION_MAPPINGS_URL: ${{ secrets.CONSTELLATION_MAPPINGS_URL }}
          NOVA_SUPPLEMENTAL_URL: ${{ secrets.NOVA_SUPPLEMENTAL_URL }}
          NOVA_SUPPLEMENTAL_TOKEN: ${{ secrets.NOVA_SUPPLEMENTAL_TOKEN }}
          ORION_SUPPLEMENTAL_URL: ${{ secrets.ORION_SUPPLEMENTAL_URL }}
          ORION_SUPPLEMENTAL_TOKEN: ${{ secrets.ORION_SUPPLEMENTAL_TOKEN }}
          THE_FUCKFACE_SUPPLEMENTAL_URL: ${{ secrets.THE_FUCKFACE_SUPPLEMENTAL_URL }}
          THE_FUCKFACE_SUPPLEMENTAL_TOKEN: ${{ secrets.THE_FUCKFACE_SUPPLEMENTAL_TOKEN }}
          FOUNDRY_KEEP_SUPPLEMENTAL_URL: ${{ secrets.FOUNDRY_KEEP_SUPPLEMENTAL_URL }}
          FOUNDRY_KEEP_SUPPLEMENTAL_TOKEN: ${{ secrets.FOUNDRY_KEEP_SUPPLEMENTAL_TOKEN }}
          SUPPLEMENTAL_PROXY_URL: ${{ secrets.SUPPLEMENTAL_PROXY_URL }}
          SUPPLEMENTAL_PROXY_TOKEN: ${{ secrets.SUPPLEMENTAL_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          CONFIG="apps/coleco/wrangler.toml"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is required"
            exit 1
          fi

          if [ -z "${MEM0_API_KEY:-}" ]; then
            echo "MEM0_API_KEY is required for Coleco"
            exit 1
          fi

          REQUIRED=(
            MEM0_API_KEY
          )

          OPTIONAL=(
            LETTA_SUPPLEMENTAL_URL
            LETTA_API_KEY
            NOTION_SUPPLEMENTAL_URL
            NOTION_SUPPLEMENTAL_TOKEN
            CONSTELLATION_REGISTRY_URL
            CONSTELLATION_MAPPINGS_URL
            NOVA_SUPPLEMENTAL_URL
            NOVA_SUPPLEMENTAL_TOKEN
            ORION_SUPPLEMENTAL_URL
            ORION_SUPPLEMENTAL_TOKEN
            THE_FUCKFACE_SUPPLEMENTAL_URL
            THE_FUCKFACE_SUPPLEMENTAL_TOKEN
            FOUNDRY_KEEP_SUPPLEMENTAL_URL
            FOUNDRY_KEEP_SUPPLEMENTAL_TOKEN
            SUPPLEMENTAL_PROXY_URL
            SUPPLEMENTAL_PROXY_TOKEN
          )

          for name in "${REQUIRED[@]}"; do
            value="${!name:-}"
            echo "Pushing required secret: ${name}"
            printf "%s" "$value" | wrangler secret put "$name" --config "$CONFIG"
          done

          for name in "${OPTIONAL[@]}"; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Skipping optional secret (not set): ${name}"
              continue
            fi
            echo "Pushing optional secret: ${name}"
            printf "%s" "$value" | wrangler secret put "$name" --config "$CONFIG"
          done
