name: Deploy siddartha

on:
  push:
    branches: [ main ]
    paths:
      - "apps/siddartha/**"
      - ".github/workflows/deploy-siddartha.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config apps/siddartha/wrangler.toml

      - name: Push Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          COMET_SECRET: ${{ secrets.COMET_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CAMPFIRE_TALKS_DB_ID: ${{ secrets.NOTION_CAMPFIRE_TALKS_DB_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CAMPFIRE_WEBHOOK_URL: ${{ secrets.CAMPFIRE_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MINDBRIDGE_ROUTER_URL: ${{ secrets.MINDBRIDGE_ROUTER_URL }}
          MINDBRIDGE_API_KEY: ${{ secrets.MINDBRIDGE_API_KEY }}
        run: |
          set -euo pipefail
          # Skip secret pushes if running in GitHub Actions
          if [ -n "$GITHUB_ACTIONS" ]; then
            echo "Skipping secret pushes from Github Actions."
            exit 0
          fi
          CONFIG="apps/siddartha/wrangler.toml"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is required"
            exit 1
          fi

          for required in MEM0_API_KEY COMET_SECRET OPENAI_API_KEY; do
            value="${!required:-}"
            if [ -z "$value" ]; then
              echo "${required} is required for Siddartha"
              exit 1
            fi
          done

          REQUIRED=(
            MEM0_API_KEY
            COMET_SECRET
            OPENAI_API_KEY
          )

          OPTIONAL=(
            NOTION_TOKEN
            NOTION_CAMPFIRE_TALKS_DB_ID
            DISCORD_WEBHOOK_URL
            CAMPFIRE_WEBHOOK_URL
            ANTHROPIC_API_KEY
            GOOGLE_API_KEY
            DEEPSEEK_API_KEY
            MISTRAL_API_KEY
            MINDBRIDGE_ROUTER_URL
            MINDBRIDGE_API_KEY
          )

          for name in "${REQUIRED[@]}"; do
            value="${!name:-}"
            echo "Pushing required secret: ${name}"
            printf "%s" "$value" | wrangler secret put "$name" --config "$CONFIG"
          done

          for name in "${OPTIONAL[@]}"; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Skipping optional secret (not set): ${name}"
              continue
            fi
            echo "Pushing optional secret: ${name}"
            printf "%s" "$value" | wrangler secret put "$name" --config "$CONFIG"
          done
